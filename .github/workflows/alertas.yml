name: Bot Francotirador de Noticias

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vigilar-mercado:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías necesarias
        run: pip install requests pandas pytz yfinance

      - name: Ejecutar Radar de 3 Fases
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_alertas.py

      - name: Guardar estado de alertas enviadas
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add estado_alertas.json || true
          git diff --staged --quiet || git commit -m "Actualizar estado de alertas"
          git push
